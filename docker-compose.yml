version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: mlops
      POSTGRES_PASSWORD: mlops
      POSTGRES_DB: mlops
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    ports:
      - "5000:5000"
    command: mlflow server --host 0.0.0.0 --backend-store-uri postgresql://mlops:mlops@postgres/mlops
    depends_on:
      - postgres

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/base.Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - mlflow

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pg_data:
